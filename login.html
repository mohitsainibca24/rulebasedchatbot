<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohit ChatBot · Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css?v=2">
</head>
<body>
  <main class="login-shell">
    <div class="login-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="eyebrow">MOHIT / CONTROL ROOM</p>
    <h1>Admin access</h1>
    <p class="intro">Sign in to manage the chatbot responses and behavior.</p>
    <form id="loginForm">
      <label>Username<input id="username" type="text" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in <span aria-hidden="true">→</span></button>
      <p id="loginStatus" class="login-status" role="alert"></p>
    </form>
    <a class="back-link" href="/">Back to chat <span aria-hidden="true">↗</span></a>
  </main>
  <script src="login.js"></script>
</body>
</html>
